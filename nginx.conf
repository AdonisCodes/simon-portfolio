server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Apple App Site Association for AutoZone Universal Links.
    # Apple requires: HTTP 200 (no redirects), application/json, no auth.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Some tooling fetches the legacy root path as well.
    location = /apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;  # Ensure that all routes go through index.html
    }

}
